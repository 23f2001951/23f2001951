<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Mandeep Beniwal - Data Science and ML, full-stack developer" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0D1B"/><stop offset="1" stop-color="#101535"/></linearGradient>
 <linearGradient id="nm" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#29E7F5"/><stop offset="55%" stop-color="#B18CFF"/><stop offset="100%" stop-color="#FF6FA5"/>
  <animate attributeName="x1" values="0%;-60%;0%" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="100%;40%;100%" dur="8s" repeatCount="indefinite"/>
 </linearGradient>
 <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#9199C4" opacity="0.28"/></pattern>
 <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
</defs>
<style>
 .tg{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;font-size:22px;font-weight:600;opacity:0;animation:cyc 16s infinite}
 .t0{animation-delay:0s} .t1{animation-delay:4s} .t2{animation-delay:8s} .t3{animation-delay:12s}
 @keyframes cyc{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
 .cur{animation:blink 1s steps(1) infinite}
 @keyframes blink{50%{opacity:0}}
 .draw{stroke-dasharray:420;stroke-dashoffset:420;animation:drw 6s ease-in-out infinite}
 @keyframes drw{0%{stroke-dashoffset:420}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
 .pt{opacity:0;animation:pop 6s ease-in-out infinite}
 @keyframes pop{0%,50%{opacity:0}60%,85%{opacity:1}100%{opacity:0}}
</style>
<g clip-path="url(#round)">
 <rect width="1000" height="300" fill="url(#bg)"/>
 <rect width="1000" height="300" fill="url(#dots)"/>
 <g filter="url(#blur)">
  <circle cx="120" cy="40" r="110" fill="#29E7F5" opacity="0.20"><animateTransform attributeName="transform" type="translate" values="0 0;80 50;0 0" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="270" r="130" fill="#FF6FA5" opacity="0.18"><animateTransform attributeName="transform" type="translate" values="0 0;-90 -40;0 0" dur="17s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="150" r="90" fill="#B18CFF" opacity="0.14"><animateTransform attributeName="transform" type="translate" values="0 0;-40 60;0 0" dur="12s" repeatCount="indefinite"/></circle>
 </g>
 <text x="60" y="78" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#29E7F5">IIT MADRAS  |  B.S. DATA SCIENCE &amp; APPLICATIONS</text>
 <text x="58" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="url(#nm)">Mandeep Beniwal</text>
 <text class="tg t0" x="60" y="196" fill="#29E7F5">Data Science &amp; Machine Learning</text>
<text class="tg t1" x="60" y="196" fill="#B18CFF">Time-series forecasting  |  LightGBM  |  XGBoost</text>
<text class="tg t2" x="60" y="196" fill="#3FE6B0">Backend &amp; full-stack systems that stay up</text>
<text class="tg t3" x="60" y="196" fill="#FFC24B">From messy data to deployed insight</text>

 <rect class="cur" x="60" y="236" width="10" height="20" fill="#29E7F5"/>
 <text x="80" y="252" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#9199C4">python  |  sql  |  ml  |  apis  |  deployment</text>
 <!-- animated model chart -->
 <g transform="translate(700,60)">
  <rect x="-20" y="-16" width="300" height="190" rx="14" fill="#131730" opacity="0.72" stroke="#282e54"/>
  <line x1="0" y1="140" x2="260" y2="140" stroke="#282e54"/><line x1="0" y1="0" x2="0" y2="140" stroke="#282e54"/>
  <path d="M0,118 C40,112 70,90 110,84 C150,78 170,56 210,40 C235,30 250,24 260,18" fill="none" stroke="#9199C4" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
  <path class="draw" d="M0,128 C30,100 60,96 90,78 C120,60 140,70 170,48 C200,28 230,34 260,10" fill="none" stroke="#29E7F5" stroke-width="3" stroke-linecap="round"/>
  <circle class="pt" cx="260" cy="10" r="5" fill="#29E7F5"/><circle class="pt" cx="260" cy="10" r="11" fill="none" stroke="#29E7F5" opacity="0.5"/>
  <text x="0" y="162" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#9199C4">forecast vs actual  |  walk-forward</text>
 </g>
</g>
<rect width="1000" height="300" rx="18" fill="none" stroke="#282e54"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>